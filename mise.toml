# mise.toml - Maintenance tasks for the mise plugin
#
# Skill updates are handled via Claude Code slash command: /update-skill
# These tasks handle versioning, validation, and release workflows.

[vars]
skill_path = "skills/mise/SKILL.md"

[tasks."update:readme"]
description = "Check README and plugin metadata for drift against live mise data"
usage = '''
flag "--offline" help="Skip fetching the mise JSON schema (schema checks are skipped)"
flag "--schema <path>" help="Use a local schema file instead of fetching it"
'''
run = '''
#!/usr/bin/env bash
# Verify the counts and examples the README / plugin metadata advertise still
# match reality. Counts come from the live mise binary and the published JSON
# schema, so this catches the drift that used to be found only by hand.
set -uo pipefail   # deliberately not -e: collect every failure, then exit once

readme="README.md"
plugin=".claude-plugin/plugin.json"
marketplace=".claude-plugin/marketplace.json"
skill="{{vars.skill_path}}"
fail=0

ok()   { printf '  \033[32m✓\033[0m %s\n' "$*"; }
bad()  { printf '  \033[31m✗\033[0m %s\n' "$*"; fail=1; }
skip() { printf '  \033[33m–\033[0m %s\n' "$*"; }

# Compare every "<N> <label>" number in a file against the expected value.
check_count() {
  local file="$1" pattern="$2" expected="$3" label="$4" claimed found=0
  while read -r claimed; do
    [ -z "$claimed" ] && continue
    found=1
    if [ "$claimed" = "$expected" ]; then
      ok "$file: $label = $claimed"
    else
      bad "$file: claims $claimed $label, actual is $expected"
    fi
  done < <(grep -oE "$pattern" "$file" 2>/dev/null | grep -oE '[0-9]+' | sort -u)
  [ "$found" = 1 ] || skip "$file: no $label count found"
}

# Flag a pattern that should no longer appear in a file.
stale() {
  local file="$1" pat="$2" why="$3"
  if grep -qE "$pat" "$file" 2>/dev/null; then
    bad "$file: $why"
    grep -nE "$pat" "$file" | head -3 | sed 's/^/        /'
  else
    ok "$file: no $why"
  fi
}

echo "Backends (from the installed mise binary)"
if command -v mise >/dev/null 2>&1; then
  n_backends=$(mise backends ls | grep -c .)
  for f in "$readme" "$plugin" "$skill"; do
    check_count "$f" '[0-9]+ backends' "$n_backends" "backends"
  done
else
  skip "mise is not on PATH"
fi

echo
echo "Schema-derived counts (mise.jdx.dev/schema/mise.json)"
schema="${usage_schema:-}"
if [ -z "$schema" ] && [ -z "${usage_offline:-}" ]; then
  schema="$(mktemp)"
  if ! curl -fsSL --max-time 20 https://mise.jdx.dev/schema/mise.json -o "$schema"; then
    skip "could not fetch the schema (pass --offline or --schema <path>)"
    schema=""
  fi
fi
if [ -n "$schema" ] && [ -s "$schema" ]; then
  n_settings=$(jq '[.["$defs"].settings | paths(type=="object" and has("description") and (has("properties")|not))] | length' "$schema")
  n_ns=$(jq '[.["$defs"].settings.properties | to_entries[] | select(.value.properties != null)] | length' "$schema")
  n_keys=$(jq '.properties | keys | length' "$schema")
  for f in "$readme" "$plugin" "$skill"; do
    check_count "$f" '[0-9]+ (configuration options|settings)' "$n_settings" "settings"
  done
  for f in "$readme" "$skill"; do
    check_count "$f" '[0-9]+ namespaces|namespaces \([0-9]+\)' "$n_ns" "setting namespaces"
  done
  check_count "$skill" '\([0-9]+; authoritative' "$n_keys" "top-level config keys"
else
  skip "schema checks skipped"
fi

echo
echo "Stale references"
stale "$readme" 'rust_cache' "rust_cache (a deprecated no-op; should not be advertised)"
stale "$plugin" 'rust_cache|Rust action cache' "Rust action cache (deprecated no-op)"
stale "$readme" '"pipx:' 'a "pipx:" example (prefer the "pypi:" spelling)'

echo
echo "Metadata consistency"
pv=$(jq -r '.version' "$plugin")
mv=$(jq -r '.plugins[0].version' "$marketplace")
if [ "$pv" = "$mv" ]; then
  ok "plugin.json and marketplace.json agree on version $pv"
else
  bad "version mismatch: plugin.json=$pv marketplace.json=$mv"
fi

skill_desc=$(awk '/^description:/{sub(/^description: */,""); print; exit}' "$skill")
mp_desc=$(jq -r '.plugins[0].description' "$marketplace")
if [ "$skill_desc" = "$mp_desc" ]; then
  ok "marketplace description matches the skill frontmatter"
else
  bad "marketplace plugin description has drifted from the skill frontmatter description"
fi

echo
if [ "$fail" = 0 ]; then
  echo "No drift detected."
  echo
  echo "Still worth a human pass after a skill update:"
  echo "  - new use cases for capabilities added since the last release"
  echo "  - the \"What's Covered\" table"
  echo "  - advanced examples, if new patterns emerged"
else
  echo "Drift detected — fix the items marked ✗ above, then re-run."
  exit 1
fi
'''

[tasks."update:version"]
description = "Bump plugin version in plugin.json and marketplace.json"
usage = '''
arg "<version>" help="New version number (e.g., 1.1.0)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
version="${usage_version?}"
echo "Bumping to version $version..."

# Update plugin.json
jq --arg v "$version" '.version = $v' .claude-plugin/plugin.json > /tmp/plugin.json.tmp
mv /tmp/plugin.json.tmp .claude-plugin/plugin.json

# Update marketplace.json (per-plugin only; root-level version key intentionally omitted)
jq --arg v "$version" '.plugins[0].version = $v' .claude-plugin/marketplace.json > /tmp/marketplace.json.tmp
mv /tmp/marketplace.json.tmp .claude-plugin/marketplace.json

echo "Updated plugin.json and marketplace.json to version $version"
echo "Don't forget to commit and push!"
'''

[tasks."update:all"]
description = "Full update workflow: bump version, update readme"
usage = '''
arg "<version>" help="New version number"
flag "--no-push" help="Skip git push"
'''
depends_post = ["update:readme"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "Update workflow:"
echo "1. Run /update-skill in Claude Code to crawl docs and update SKILL.md"
echo "2. Review changes in skills/mise/SKILL.md"
echo "3. Run: mise run update:version ${usage_version?}"
echo "4. Run: git add -A && git commit -m 'feat: update skill to v${usage_version?}'"
if [ -z "${usage_no_push:-}" ]; then
  echo "5. Run: git push"
fi
'''

[tasks.lint]
description = "Validate skill file structure"
run = '''
#!/usr/bin/env bash
set -euo pipefail
skill="skills/mise/SKILL.md"

echo "Checking $skill..."

# Check frontmatter exists
if ! head -1 "$skill" | grep -q "^---"; then
  echo "ERROR: Missing frontmatter"
  exit 1
fi

# Check required sections
for section in "STRICT ENFORCEMENT" "Overview" "Task Definition" "Usage Spec" "Task Configuration" "Dev Tools" "Environment" "Best Practices"; do
  if ! grep -q "$section" "$skill"; then
    echo "WARNING: Missing section: $section"
  fi
done

# Check for blocked patterns in examples.
#
# The skill deliberately shows $1/$@ etc. in its "BLOCKED Patterns" and "DON'T"
# reference sections, so a plain line-based grep false-positives on them (the
# marker sits on a *preceding* line, not the offending one). Skip those whole
# sections instead, and track code fences so TOML comments like "# Execution"
# aren't mistaken for markdown headings.
violations=$(awk '
  /^```/                         { fence = !fence; next }
  !fence && /^#+[[:space:]]/     { skip = ($0 ~ /BLOCKED|DON.T|Never/) ? 1 : 0 }
  skip                           { next }
  /\$1|\$2|\$@|\$\*/ {
    if ($0 ~ /BLOCKED|DON.T|Never|never|shell-native/) next
    printf "%d:%s\n", NR, $0
  }
' "$skill")

if [ -n "$violations" ]; then
  echo "$violations"
  echo "WARNING: Found potentially unblocked shell-native arg patterns"
fi

echo "Validation complete."
'''
